name: PS5 Pro Wächter

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub startet oft ein paar Minuten später)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Test-Benachrichtigung schicken"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ps5-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Shops prüfen
        run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          TEST_NOTIFY: ${{ inputs.test_notify }}

      - name: Status speichern
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "ps5-waechter"
            git config user.email "ps5-waechter@users.noreply.github.com"
            git add state.json
            git commit -m "Status-Update"
            git push
          fi
